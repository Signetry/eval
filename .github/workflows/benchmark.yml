name: benchmark

# Regenerate the detection head-to-head table on every release (and on demand),
# publish it as a release artifact, and commit the refreshed markdown into
# docs/BENCHMARK.md so the published numbers always match the shipped engine.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Require the umbra-core detection engine
        run: |
          # The release benchmark must run against a umbra-core that has the SAST
          # engine. Fail loudly if it is missing (a real release misconfiguration).
          python -c "from umbra_core import scan_repository" || {
            echo "::error::Installed umbra-core lacks scan_repository; pin a umbra-core with the detection engine."
            exit 1
          }
      - name: Regenerate the head-to-head table
        run: |
          mkdir -p docs
          {
            echo "<!-- Generated by .github/workflows/benchmark.yml — do not edit by hand. -->"
            echo ""
            umbra-eval corpus --markdown
          } > docs/BENCHMARK.md
          umbra-eval corpus --json > docs/BENCHMARK.json
      - name: Gate on parity (Umbra must keep 100% recall, 0 false positives)
        run: umbra-eval corpus --min-recall 1.0 --max-fp 0
      - uses: actions/upload-artifact@v7
        with:
          name: detection-benchmark
          path: |
            docs/BENCHMARK.md
            docs/BENCHMARK.json
      - name: Commit refreshed benchmark (on release)
        if: github.event_name == 'release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/BENCHMARK.md docs/BENCHMARK.json
          git commit -m "docs: refresh detection head-to-head benchmark for ${{ github.event.release.tag_name }}" || echo "no changes"
          git push || echo "push skipped"
