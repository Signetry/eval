name: benchmark

# Checks that docs/BENCHMARK.{md,json} — the detection head-to-head against the other
# scanners — is current.
#
# This workflow does not publish. It regenerates the table with `make benchmark` (the same
# recipe a contributor runs) and fails if the committed table differs. Refreshing is a
# pull request.
#
# It used to push the refreshed table straight to `main`, which branch protection rejects:
# every run that actually had a change to publish failed at the push, and the failure came
# before the parity gate below, so a detection regression would have read as a git error.
# Runs only looked green because the table happened to be unchanged and the push step took
# its "no change to publish" exit. Verifying instead of pushing removes both failure modes.
#
# It runs on a schedule as well as on releases: the detection corpus and the competing
# scanners both change between tags, and a table only refreshed at release time can be
# months out of date while still reading as current.
#
# This workflow owns docs/BENCHMARK.{md,json} and nothing else; the governance leaderboard
# is owned by leaderboard.yml. Nothing is pushed by either, so they no longer share a
# concurrency group.
on:
  schedule:
    # Mondays 06:47 UTC. Off the hour on purpose (scheduled jobs queued at :00 are
    # delayed under load) and clear of leaderboard.yml's 07:23 slot.
    - cron: "47 6 * * 1"
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "signetry_eval/corpus/**"
      - "signetry_eval/detection.py"
      # The table is produced by the pinned signetry-core's scanner, so the pin is an input
      # to it: bumping it without refreshing is exactly the staleness caught here.
      - "pyproject.toml"
      - "Makefile"
  # Verify on the pull request too, so a change to any input above cannot merge while
  # leaving the committed table stale. Only safe to run on PRs because the token below is
  # read-only and this job needs no secrets.
  pull_request:
    paths:
      - "signetry_eval/corpus/**"
      - "signetry_eval/detection.py"
      - "pyproject.toml"
      - "Makefile"
  workflow_dispatch:

# Read-only: nothing here writes to the repository any more.
permissions:
  contents: read

concurrency:
  # Only stops a superseded commit's verification from running alongside the commit that
  # replaced it — there is no longer a push to serialise against leaderboard.yml.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request, check out the pull request (checkout's default for the
          # event) — verifying the default branch would say nothing about the change under
          # review. Otherwise pin the default branch: on a release event the incoming ref
          # is the tag, which is not where the table is committed.
          ref: ${{ github.event_name == 'pull_request' && '' || (github.event.repository.default_branch || 'main') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"

      - name: Regenerate the head-to-head table
        id: regen
        run: |
          # `make benchmark` is the single recipe, shared with contributors: the workflow
          # no longer inlines the commands, so the generated header and the command that
          # actually writes the file cannot drift apart.
          #
          # The recipe refuses to run without the signetry-core detection engine. That
          # matters more here than anywhere else: this benchmark has no meaning without the
          # scanner, and an absent scanner must never be published as a zero.
          make benchmark

      - uses: actions/upload-artifact@v7
        with:
          name: detection-benchmark
          path: |
            docs/BENCHMARK.md
            docs/BENCHMARK.json
          if-no-files-found: error

      - name: Are the committed numbers current?
        run: |
          # Diff-only: the regeneration above already wrote into the working tree.
          make check-benchmark || {
            echo "::error::docs/BENCHMARK.{md,json} are stale. Run 'make benchmark', commit the result, and open a pull request."
            exit 1
          }

      - name: Gate on parity (Signetry must keep 100% recall, 0 false positives)
        # Must run even when the staleness check failed — see the same guard in
        # leaderboard.yml. Without it a stale table aborts the job before the regression is
        # judged, and a real detection regression would surface as a docs error.
        if: ${{ !cancelled() && steps.regen.outcome == 'success' }}
        run: |
          # Last, deliberately: staleness is reported above whatever this says, then this
          # step fails the run so a regression cannot be missed.
          signetry-eval corpus --min-recall 1.0 --max-fp 0
