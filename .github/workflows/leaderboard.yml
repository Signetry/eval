name: leaderboard

# Checks that docs/LEADERBOARD.{md,json} — the two-axis governance leaderboard, including
# third-party submissions from leaderboard/entries/ — is current.
#
# This workflow does not publish. It regenerates the page with `make leaderboard` (the
# same recipe a contributor runs and the one printed on the page itself) and fails if the
# committed page differs. Refreshing is a pull request.
#
# It used to push the refreshed page straight to `main`. `main` requires a pull request,
# so every run that actually had a change to publish was rejected by branch protection —
# the page went stale rather than current, and because the push failed before the gate
# below, a broken defense would have read as a git error. Verifying instead of pushing
# removes both failure modes and keeps the numbers arriving the way every other change
# does, which is the argument this repository exists to make.
#
# Why a schedule and not just releases: the governance axis takes submissions, so the
# page changes when someone else's PR lands, not only when we cut a tag. A leaderboard
# whose numbers are as old as the last release is a changelog.
#
# This workflow owns docs/LEADERBOARD.{md,json} and nothing else. The detection
# head-to-head (docs/BENCHMARK.md) is owned by benchmark.yml — one generator per file, so
# every "Generated by ..." header names the recipe that actually wrote it.
on:
  schedule:
    # Mondays 07:23 UTC. Off the hour on purpose: scheduled jobs queued at :00 are
    # delayed under load, and 07:23 leaves benchmark.yml's 06:47 slot clear.
    - cron: "23 7 * * 1"
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - "leaderboard/entries/**"
      - "signetry_eval/leaderboard.py"
      - "signetry_eval/report.py"
      - "signetry_eval/scenarios/**"
      # The live row is labelled with the pinned signetry-core, so the pin is an input to
      # the page: bumping it without refreshing is exactly the staleness caught here.
      - "pyproject.toml"
      - "Makefile"
  # Verify on the pull request too, so a change to any input above cannot merge while
  # leaving the committed page stale. Only safe to run on PRs because the token below is
  # read-only and this job needs no secrets.
  pull_request:
    paths:
      - "leaderboard/entries/**"
      - "signetry_eval/leaderboard.py"
      - "signetry_eval/report.py"
      - "signetry_eval/scenarios/**"
      - "pyproject.toml"
      - "Makefile"
  workflow_dispatch:

# Read-only: nothing here writes to the repository any more.
permissions:
  contents: read

concurrency:
  # Nothing is pushed any more, so there is no cross-workflow write to serialise against
  # benchmark.yml; this only stops a superseded commit's verification from running
  # alongside the commit that replaced it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Verify the ref that triggered us. On a pull request that is `refs/pull/N/merge`
          # — the merge result, which is what actually lands — because verifying the default
          # branch would say nothing about the change under review. The one exception is a
          # release: its ref is the tag, which is not where the page is committed.
          #
          # The *release* case is the true branch on purpose. The obvious spelling,
          # `event_name == 'pull_request' && '' || default_branch`, is a trap: Actions' `&&`
          # and `||` yield operand values rather than booleans, so a falsy true branch ('')
          # collapses to the false branch and *every* event checks out the default branch.
          # This workflow shipped that bug for one run: PR #39 verified `main` instead of
          # itself. Both branches here are non-empty strings.
          ref: ${{ github.event_name == 'release' && (github.event.repository.default_branch || 'main') || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"

      - name: Regenerate the leaderboard
        id: regen
        run: |
          # `make leaderboard` is the single recipe, shared with contributors. CI does not
          # inline the commands: when it did, the workflow and the regeneration
          # instructions printed on the page drifted, and the page ended up documenting a
          # command that produced a different page.
          #
          # The recipe reads the version label from the installed signetry-core and fails
          # outright if the SAST engine is absent, rather than regenerating an axis-1-only
          # page that would diff against the committed two-axis page and read as merely
          # stale when the real problem is the install.
          # The checked-out tree must be the one that carries the recipe. `make leaderboard`
          # without a Makefile does not necessarily fail: `leaderboard` can name a real path in
          # this repository, in which case make treats the target as already up to date and
          # exits 0 — "Nothing to be done for 'leaderboard'". A regeneration step that silently
          # regenerates nothing is the same class of bug as the push step that silently
          # exited 0 on "no change to publish", so check before trusting it.
          test -f Makefile || {
            echo "::error::No Makefile in the checked-out tree — regeneration would silently do nothing. Wrong ref?"
            exit 1
          }
          make leaderboard

      - uses: actions/upload-artifact@v7
        with:
          name: governance-leaderboard
          path: |
            docs/LEADERBOARD.md
            docs/LEADERBOARD.json
          if-no-files-found: error

      - name: Are the committed numbers current?
        run: |
          # Diff-only: the regeneration above already wrote into the working tree.
          make check-leaderboard || {
            echo "::error::docs/LEADERBOARD.{md,json} are stale. Run 'make leaderboard', commit the result, and open a pull request."
            exit 1
          }

      - name: Gate — every governed defense must hold
        # Must run even when the staleness check failed. Ordering this step last is
        # deliberate, but `if:` is what makes the ordering safe: a failing step above
        # aborts the job before the gate, so a broken defense would surface as a stale-page
        # error and the defense itself would never be judged. Skipped only when
        # regeneration did not produce numbers to judge in the first place.
        if: ${{ !cancelled() && steps.regen.outcome == 'success' }}
        run: |
          # Last, deliberately: staleness is reported above whatever this says, then this
          # step fails the run so a broken defense is impossible to miss.
          signetry-eval run > /dev/null || {
            echo "::error::An adversarial scenario's defense did not hold."
            exit 1
          }
