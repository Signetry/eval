name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          # umbra-core >= 0.3.0 is on PyPI, so the pinned dependency resolves
          # directly. (Capability graph, plan binding, masked verifier, gates,
          # admit-extension all shipped in 0.3.0.)
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check umbra_eval/ tests/
      - name: Tests
        run: pytest -q
      - name: Publish the adversarial report (artifact)
        if: always()
        run: |
          umbra-eval run --markdown > eval-report.md || true
          umbra-eval run --json > eval-report.json || true
      - name: Detection head-to-head (20/40/45-case corpus vs committed Opus 4.8 capture)
        if: always()
        run: |
          # Regenerates the head-to-head table. The competitor baseline is the
          # committed capture in umbra_eval/detection/captures/. Umbra runs live
          # (deterministic, offline). --min-recall/--max-fp gate a regression:
          # if Umbra's recall drops or it raises a false positive, CI fails.
          umbra-eval corpus --markdown > detection-headtohead.md
          umbra-eval corpus --json > detection-headtohead.json
          umbra-eval corpus --min-recall 1.0 --max-fp 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umbra-eval-report-${{ matrix.python-version }}
          path: |
            eval-report.md
            eval-report.json
            detection-headtohead.md
            detection-headtohead.json
          if-no-files-found: ignore
