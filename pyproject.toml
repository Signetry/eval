[project]
name = "signetry-eval"
version = "0.3.0"
description = "The public adversarial evaluation suite for Signetry: measures attack success rate (ASR) and utility-under-defense for coding-agent prompt injection, skill/MCP poisoning, and memory-injection threats, governed by signetry-core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Binay Dalai" }]
keywords = [
    "ai-agents", "coding-agents", "prompt-injection", "red-team", "evaluation",
    "agentdojo", "minja", "supply-chain", "security", "asr",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "signetry-core @ git+https://github.com/Signetry/core@v0.8.0",
]

[project.urls]
Homepage = "https://github.com/Signetry/eval"
Repository = "https://github.com/Signetry/eval"
Issues = "https://github.com/Signetry/eval/issues"
Umbrella = "https://github.com/Signetry/signetry"

[project.scripts]
signetry-eval = "signetry_eval.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# signetry-core is a direct git reference: it is source-available under BUSL-1.1
# and is not published on PyPI, so it installs from its source repo.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["signetry_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF"]
