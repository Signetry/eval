[project]
name = "umbra-eval"
version = "0.2.2"
description = "The public adversarial evaluation suite for Umbra: measures attack success rate (ASR) and utility-under-defense for coding-agent prompt injection, skill/MCP poisoning, and memory-injection threats, governed by umbra-core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — All Rights Reserved" }
authors = [{ name = "Binay Dalai" }]
keywords = [
    "ai-agents", "coding-agents", "prompt-injection", "red-team", "evaluation",
    "agentdojo", "minja", "supply-chain", "security", "asr",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "umbra-core @ git+https://github.com/bkd-dotcom/umbra-core@v0.5.4",
]

[project.urls]
Homepage = "https://github.com/bkd-dotcom/umbra-eval"
Repository = "https://github.com/bkd-dotcom/umbra-eval"
Issues = "https://github.com/bkd-dotcom/umbra-eval/issues"
Umbrella = "https://github.com/bkd-dotcom/umbra-umbrella"

[project.scripts]
umbra-eval = "umbra_eval.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# umbra-core is a direct git reference (All Rights Reserved; not on PyPI).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["umbra_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "RUF"]
